  "@tailwindcss/oxide>@tailwindcss/oxide-win32-x64-msvc": "-"
  "@tailwindcss/oxide>@tailwindcss/oxide-linux-x64-musl": "-"
  "rollup>@rollup/rollup-android-arm-eabi": "-"
  "rollup>@rollup/rollup-android-arm64": "-"
  "rollup>@rollup/rollup-darwin-arm64": "-"
  "rollup>@rollup/rollup-darwin-x64": "-"
  "rollup>@rollup/rollup-freebsd-arm64": "-"
  "rollup>@rollup/rollup-freebsd-x64": "-"
  "rollup>@rollup/rollup-linux-arm-gnueabihf": "-"
  "rollup>@rollup/rollup-linux-arm-musleabihf": "-"
  "rollup>@rollup/rollup-linux-arm64-gnu": "-"
  "rollup>@rollup/rollup-linux-arm64-musl": "-"
  "rollup>@rollup/rollup-linux-loong64-gnu": "-"
  "rollup>@rollup/rollup-linux-loong64-musl": "-"
  "rollup>@rollup/rollup-linux-ppc64-gnu": "-"
  "rollup>@rollup/rollup-linux-ppc64-musl": "-"
  "rollup>@rollup/rollup-linux-riscv64-gnu": "-"
  "rollup>@rollup/rollup-linux-riscv64-musl": "-"
  "rollup>@rollup/rollup-linux-s390x-gnu": "-"
  "rollup>@rollup/rollup-linux-x64-musl": "-"
  "rollup>@rollup/rollup-openbsd-x64": "-"
  "rollup>@rollup/rollup-openharmony-arm64": "-"
  "rollup>@rollup/rollup-win32-arm64-msvc": "-"
  "rollup>@rollup/rollup-win32-ia32-msvc": "-"
  "rollup>@rollup/rollup-win32-x64-gnu": "-"
  "rollup>@rollup/rollup-win32-x64-msvc": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.1"
  # qs@6.15.1 is vulnerable to GHSA-q8mj-m7cp-5q26; force the patched version
  qs: ">=6.15.2"
  # uuid@8.3.2 is vulnerable to GHSA-w5hq-g745-h8pq; force the patched version
  # Pinned to ^11 (not >=9) because uuid@12+ is ESM-only and breaks CJS consumers (e.g. exceljs)
  uuid: "^11.1.0"
  # linkify-it<=5.0.1 is vulnerable to GHSA-22p9-wv53-3rq4 and GHSA-v245-v573-v5vm (quadratic ReDoS); force patched version
  linkify-it: ">=5.0.2"
  # markdown-it<=14.1.1 is vulnerable to GHSA-6v5v-wf23-fmfq (quadratic DoS in smartquotes); force patched version
  markdown-it: ">=14.2.0"
  # dompurify<=3.4.11 is vulnerable to GHSA-c2j3-45gr-mqc4 (CUSTOM_ELEMENT_HANDLING bypass) and GHSA-cmwh-pvxp-8882 (ALLOWED_ATTR pollution); force patched version
  dompurify: ">=3.4.12"
  # js-yaml>=5.0.0 <=5.2.1 is vulnerable to GHSA-pm4m-ph32-ghv5 (exponential parsing time in flow collections) and
  # GHSA-724g-mxrg-4qvm (quadratic DoS via !!omap); js-yaml<=4.1.1 is vulnerable to GHSA-h67p-54hq-rp68;
  # combined fix requires >=5.2.2
  js-yaml: ">=5.2.2"
  # fast-uri>=3.0.0 <=3.1.3 is vulnerable to GHSA-4c8g-83qw-93j6 (host confusion via literal backslash authority
  # delimiter) and GHSA-v2hh-gcrm-f6hx (host confusion via failed IDN canonicalization); force patched version
  fast-uri: ">=3.1.4"
  # body-parser>=2.0.0 <2.3.0 is vulnerable to GHSA-v422-hmwv-36x6 (DoS via invalid limit value); force patched version
  body-parser: ">=2.3.0"
  # @babel/core<=7.29.0 is vulnerable to GHSA-4x5r-pxfx-6jf8 (arbitrary file read via sourceMappingURL); force patched version
  "@babel/core": ">=7.29.6"
  # brace-expansion<=5.0.7 is vulnerable to GHSA-mh99-v99m-4gvg (DoS via unbounded expansion causing OOM crash); force patched version
  brace-expansion: ">=5.0.8"
  # postcss<=8.5.14 is vulnerable to GHSA-r28c-9q8g-f849; force patched version
  postcss: ">=8.5.15"
