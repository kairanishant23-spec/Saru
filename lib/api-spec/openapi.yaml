  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get business settings
      responses:
        "200":
          description: Business settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update business settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
      required: [id, email, name, role]

    DashboardStats:
      type: object
      properties:
        totalProducts:
          type: integer
        totalSuppliers:
          type: integer
        totalCustomers:
          type: integer
        totalPurchasesThisMonth:
          type: number
        totalSalesThisMonth:
          type: number
        lowStockCount:
          type: integer
        recentPurchases:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseWithSupplier"
        recentSales:
          type: array
          items:
            $ref: "#/components/schemas/SaleWithCustomer"
      required:
        - totalProducts
        - totalSuppliers
        - totalCustomers
        - totalPurchasesThisMonth
        - totalSalesThisMonth
        - lowStockCount
        - recentPurchases
        - recentSales

    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        gstin:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, name, createdAt, updatedAt]

    SupplierInput:
      type: object
      properties:
        name:
          type: string
        contactPerson:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        gstin:
          type: ["string", "null"]
      required: [name]

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        unit:
          type: string
        hsn:
          type: ["string", "null"]
        gstRate:
          type: number
        purchasePrice:
          type: number
        sellingPrice:
          type: number
        currentStock:
          type: number
        minStock:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
