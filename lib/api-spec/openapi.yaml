  /reports/purchases:
    get:
      operationId: getPurchasesReport
      tags: [reports]
      summary: Purchases report with date range filter
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
